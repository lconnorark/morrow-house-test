<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morrow House</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="overlay" aria-hidden="true"></div>

    <main id="svg-container">
        <svg id="floorplan-svg" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" aria-label="Interactive dogtrot floorplan">
            <defs>
                <pattern id="floorboards" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect width="20" height="20" fill="#f5ede1" />
                    <path d="M0 10h20M10 0v10M5 10v10" stroke="#e4d8c8" stroke-width="1" />
                </pattern>
            </defs>

            <rect x="0" y="0" width="1000" height="650" fill="white" />

            <!-- Porch -->
            <rect x="50" y="500" width="900" height="120" fill="#e8d9b5" stroke="#333" stroke-width="2" />
            <text x="500" y="565" text-anchor="middle" font-size="22">Front Porch</text>
            <circle class="hotspot" cx="500" cy="560" r="14" data-hotspot="porch" role="button" aria-label="View Front Porch details" tabindex="0" />

            <!-- War Room -->
            <rect x="50" y="200" width="350" height="300" fill="url(#floorboards)" stroke="#333" stroke-width="3" />
            <text x="225" y="230" text-anchor="middle" font-size="22">War Room</text>
            <circle class="hotspot" cx="225" cy="350" r="12" data-hotspot="warRoom" role="button" aria-label="View War Room details" tabindex="0" />
            <rect x="35" y="325" width="20" height="50" fill="#8b4c39" stroke="#333" stroke-width="2" />

            <!-- Breezeway -->
            <rect x="400" y="200" width="200" height="300" fill="#e6f2d9" stroke="#333" stroke-width="3" />
            <text x="500" y="350" text-anchor="middle" font-size="22">Breezeway</text>
            <circle class="hotspot" cx="500" cy="350" r="12" data-hotspot="breezeway" role="button" aria-label="View Breezeway details" tabindex="0" />
            <rect x="450" y="500" width="100" height="20" fill="#ffffff" />
            <path d="M400 310 A40 40 0 0 1 440 350" fill="none" stroke="#555" stroke-width="3" />
            <path d="M600 310 A40 40 0 0 0 560 350" fill="none" stroke="#555" stroke-width="3" />

            <!-- Living Room -->
            <rect x="600" y="200" width="350" height="300" fill="url(#floorboards)" stroke="#333" stroke-width="3" />
            <text x="775" y="230" text-anchor="middle" font-size="22">Living Room</text>
            <circle class="hotspot" cx="775" cy="350" r="12" data-hotspot="livingRoom" role="button" aria-label="View Living Room details" tabindex="0" />
            <rect x="950" y="325" width="20" height="50" fill="#8b4c39" stroke="#333" stroke-width="2" />
        </svg>
    </main>

    <aside id="info-panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="info-title" aria-hidden="true">
        <button id="close-panel" type="button" aria-label="Close details">&times;</button>
        <h2 id="info-title">Room Details</h2>
        <p id="info-text">Select a highlighted area on the floorplan to learn more.</p>
        <img id="info-image" alt="Historical view of this area" />
        <div id="timeline-container"></div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
